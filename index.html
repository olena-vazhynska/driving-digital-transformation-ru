/* --------------------------- helpers --------------------------- */

const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));

function colorFor(key, v) {
  if (key === "speed") {
    if (v >= 35 && v <= 70) return "#3fb950";
    if ((v >= 25 && v < 35) || (v > 70 && v <= 82)) return "#e3a008";
    return "#f85149";
  }
  if (v >= 60) return "#3fb950";
  if (v >= 35) return "#e3a008";
  return "#f85149";
}
function isAlarm(key, v) {
  if (key === "speed") return v < 25 || v > 82;
  return v < 30;
}
const valToDeg = (v) => 180 * (1 - clamp(v) / 100);
function polar(cx, cy, r, deg) {
  const a = (deg * Math.PI) / 180;
  return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
}
function arcPath(cx, cy, r, vA, vB) {
  const d1 = valToDeg(vA), d2 = valToDeg(vB);
  const steps = 40;
  let p = "";
  for (let i = 0; i <= steps; i++) {
    const d = d1 + ((d2 - d1) * i) / steps;
    const [x, y] = polar(cx, cy, r, d);
    p += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2) + " ";
  }
  return p.trim();
}

/* smooth tween of the whole values object, respects reduced motion */
function useTween(target, dur = 750) {
  const [v, setV] = useState(target);
  const ref = useRef(target);
  useEffect(() => {
    const reduced = typeof window !== "undefined" &&
      window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) { ref.current = target; setV(target); return; }
    const from = { ...ref.current };
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const k = Math.min(1, (t - start) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      const nv = {};
      for (const key in target) nv[key] = from[key] + (target[key] - from[key]) * e;
      ref.current = nv; setV(nv);
      if (k < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [JSON.stringify(target)]); // eslint-disable-line
  return v;
}

/* --------------------------- components --------------------------- */

function Gauge({ meta, value }) {
  const cx = 60, cy = 58, r = 46;
  const col = colorFor(meta.key, value);
  const alarm = meta.lamp && isAlarm(meta.key, value);
  const [nx, ny] = polar(cx, cy, r - 6, valToDeg(value));
  return (
    <div className={"gauge" + (alarm ? " alarm" : "")}>
      {meta.lamp && <span className={"lamp" + (alarm ? " on" : "")} />}
      <svg viewBox="0 0 120 70" width="100%" style={{ display: "block" }}>
        {/* track */}
        <path d={arcPath(cx, cy, r, 0, 100)} fill="none" stroke="#202833" strokeWidth="9" strokeLinecap="round" />
        {/* optimal band for the speedometer */}
        {meta.key === "speed" && (
          <path d={arcPath(cx, cy, r, 35, 70)} fill="none" stroke="rgba(63,185,80,.28)" strokeWidth="9" strokeLinecap="round" />
        )}
        {/* value */}
        <path d={arcPath(cx, cy, r, 0, value)} fill="none" stroke={col} strokeWidth="9" strokeLinecap="round" />
        {/* needle */}
        <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="#e8eef5" strokeWidth="2.4" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="4.5" fill="#e8eef5" />
        <circle cx={cx} cy={cy} r="2" fill="#0d1117" />
      </svg>
      <div className="gval" style={{ color: col }}>{Math.round(value)}</div>
      <div className="glab">{meta.label}</div>
      <div className="gsub">{meta.sub}</div>
    </div>
  );
}

function Odometer({ value }) {
  const digits = String(Math.max(0, Math.round(value))).padStart(5, "0").split("");
  return (
    <div className="odo odo-wide">
      <div className="odo-meta">
        <div className="glab">Обучение и полученный опыт</div>
        <div className="gsub">ОДОМЕТР · НАКОПЛЕННЫЙ ОПЫТ</div>
      </div>
      <div className="row" style={{ gap: 6 }}>
        <div className="odo-digits">
          {digits.map((d, i) => <span className="cell" key={i}>{d}</span>)}
        </div>
        <span className="odo-unit">км</span>
      </div>
    </div>
  );
}

function Cluster({ values }) {
  return (
    <div className="cluster">
      {GAUGES.map((g) => <Gauge key={g.key} meta={g} value={values[g.key]} />)}
      <Odometer value={values.learn} />
    </div>
  );
}

          <li>Семь дорожных событий, на каждое — 2–3 минуты на обсуждение и выбор.</li>
          <li>Ориентировочное время: 35–40 минут, включая разбор в конце.</li>
          <li>После финиша вернитесь к вопросам для размышления и сравните маршруты разных групп.</li>
        </ul>
      </details>
      <div style={{ marginTop: 26 }}>
        <button className="btn" onClick={onStart}>Начать движение →</button>
      </div>
    </div>
  );
}

function Debrief({ values, onRestart }) {
  const health = (k, v) => (k === "speed" ? clamp(100 - Math.abs(v - 52) * 2) : v);
  const scored = GAUGES.map((g) => ({ ...g, v: values[g.key], h: health(g.key, values[g.key]) }));
  const lows = scored.filter((s) => s.h < 30).length;
  const avg = Math.round(scored.reduce((a, s) => a + s.h, 0) / scored.length);
  const balance = clamp(avg - lows * 8 + Math.min(10, values.learn / 12), 0, 100);
  const hardest = scored.reduce((m, s) => (s.h < m.h ? s : m), scored[0]);

  let title, text;
  if (lows === 0 && avg >= 55) {
    title = "Уверенный курс";
    text = "Вы провели организацию через трансформацию, удержав баланс между скоростью, доверием и людьми. Это и есть адаптивное руководство — вы не просто доехали, вы привезли всех с собой.";
  } else if (lows <= 1) {
    title = "Достигнуто с компромиссами";
    text = "Цель близка, но один из индикаторов заметно просел. Хороший повод для разбора: чего стоила эта уступка и можно ли было удержать баланс иначе?";
  } else {
    title = "Цель ценой устойчивости";
    text = "Вы доехали до вехи, но несколько индикаторов в красной зоне. Скорость и сроки взяли верх над балансом — одна из самых частых ловушек цифровой трансформации.";
  }

  const questions = [
    "Какой показатель было сложнее всего удержать в балансе?",
    "Чему вы чаще отдавали приоритет — скорости, ценностям или срокам?",
    "Как этические соображения повлияли на ваши решения?",
    "Какие уроки применимы к процессу трансформации вашей организации?",
  ];

  return (
    <div className="intro-card">
      <div className="eyebrow">Разбор маршрута · Финиш</div>
      <div className="verdict">{title}</div>
      <div className="row" style={{ marginBottom: 4 }}>
        <span className="chip">ИНДЕКС БАЛАНСА: {Math.round(balance)}</span>
        <span className="chip">ОПЫТ: {Math.round(values.learn)} км</span>
        <span className="chip">КРАСНАЯ ЗОНА: {lows}</span>
      </div>
      <p className="lede" style={{ marginTop: 14 }}>{text}</p>
      <p className="outcome" style={{ marginTop: 10 }}>
        Сложнее всего было удержать: <strong style={{ color: "var(--ink)" }}>{hardest.label.toLowerCase()}</strong>.
      </p>

      <div style={{ marginTop: 20 }}><Cluster values={values} /></div>

      <div className="q-block">
        <div className="eyebrow" style={{ color: "var(--mut)" }}>Вопросы для размышления</div>
        {questions.map((q, i) => (
          <div className="q" key={i}>
            <span className="n">{i + 1}</span>
            <p>{q}</p>
          </div>
        ))}
      </div>

      <p className="outcome">
        Реализация цифровой трансформации — это не только соблюдение сроков, но и поиск баланса
        и адаптация. Доверие, моральный дух, риски, обучение и видение всё время взаимодействуют,
        и сильное руководство — это умение вести их вместе.
      </p>

      <div style={{ marginTop: 24 }}>
        <button className="btn ghost" onClick={onRestart}>Пройти заново ↺</button>
      </div>
    </div>
  );
}

/* --------------------------- app --------------------------- */

function App() {
  const [phase, setPhase] = useState("intro"); // intro | play | result | debrief
  const [stageIdx, setStageIdx] = useState(0);
  const [values, setValues] = useState(INITIAL);
  const [lastChoice, setLastChoice] = useState(null);
  const display = useTween(values);

  const stage = STAGES[stageIdx];

  const start = () => { setValues(INITIAL); setStageIdx(0); setLastChoice(null); setPhase("play"); };

  const choose = (choice) => {
    const next = { ...values };
    for (const k in choice.fx) {
      next[k] = k === "learn" ? Math.max(0, next[k] + choice.fx[k]) : clamp(next[k] + choice.fx[k]);
    }
    setValues(next);
    setLastChoice(choice);
    setPhase("result");
  };

  const advance = () => {
    if (stageIdx + 1 >= STAGES.length) { setPhase("debrief"); }
    else { setStageIdx(stageIdx + 1); setLastChoice(null); setPhase("play"); }
  };

  const deltaLabel = (k) => {
    const names = { trust: "Доверие", speed: "Темп", ethics: "Этика", vision: "Видение",
      morale: "Мораль", risk: "Риски", learn: "Опыт" };
    return names[k] || k;
  };

  return (
    <div className="drv-root">
      <style dangerouslySetInnerHTML={{ __html: CSS }} />
      <div className="drv-wrap">

        {phase === "intro" && <Intro onStart={start} />}

        {(phase === "play" || phase === "result") && (
          <>
            <div className="routebar">
              <span className="stage-lbl">Этап {stageIdx + 1} / {STAGES.length}</span>
              <div className="road">
                <div className="lane" />
                <div className="fill" style={{ width: `${((stageIdx + (phase === "result" ? 1 : 0)) / STAGES.length) * 100}%` }} />
              </div>
              <span className="stage-lbl mono">🚗</span>
            </div>

            <Cluster values={display} />

            <div className="windshield">
              <div className="ev-head">
                <span className="ev-icon">{stage.icon}</span>
                <div>
                  <div className="ev-title">{stage.title}</div>
                  <span className="chip">Индикатор: {stage.tag}</span>
                </div>
              </div>

              {phase === "play" && (
                <>
                  <p className="ev-body">{stage.body}</p>
                  <div className="choices">
                    {stage.choices.map((c, i) => (
                      <button className="choice" key={i} onClick={() => choose(c)}>{c.label}</button>
                    ))}
                  </div>
                </>
              )}

              {phase === "result" && lastChoice && (
                <>
                  <p className="result-note">{lastChoice.note}</p>
                  <div className="deltas">
                    {Object.entries(lastChoice.fx).map(([k, d]) => (
                      <span className={"delta " + (d > 0 ? "up" : "dn")} key={k}>
                        {deltaLabel(k)} {d > 0 ? "+" : ""}{d}{k === "learn" ? " км" : ""}
                      </span>
                    ))}
                  </div>
                  <button className="btn" onClick={advance}>
                    {stageIdx + 1 >= STAGES.length ? "К разбору маршрута →" : "Продолжить движение →"}
                  </button>
                </>
              )}
            </div>
          </>
        )}

        {phase === "debrief" && <Debrief values={values} onRestart={start} />}

        <div className="footer">Цифровая трансформация в социальной защите · DCI · Симуляция «Баланс и адаптация»</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
